services:
  proofhub-mcp:
    build: .
    image: proofhub-mcp:local
    environment:
      PROOFHUB_BASE_URL: ${PROOFHUB_BASE_URL}
      PROOFHUB_API_KEY: ${PROOFHUB_API_KEY}
      PROOFHUB_USER_AGENT: ${PROOFHUB_USER_AGENT}
      PROOFHUB_PROJECT_ID: ${PROOFHUB_PROJECT_ID}
      PROOFHUB_TODOLIST_ID: ${PROOFHUB_TODOLIST_ID}
      MCP_TRANSPORT: http
      MCP_HTTP_PORT: 8080
    ports:
      - "8080:8080"
    restart: unless-stopped
